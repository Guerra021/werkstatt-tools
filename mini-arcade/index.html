<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Arcade</title>
<style>
  :root {
    --bg: #12102a;
    --bg2: #1d1a44;
    --fg: #f3f1ff;
    --muted: #a9a4d6;
    --accent: #ffcc33;
    --good: #4ade80;
    --bad: #f87171;
    --card: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--fg);
    font-family: system-ui, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  #wrap { position: relative; width: min(480px, 100vw); height: min(720px, 100vh); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 16px; background: rgba(0,0,0,0.25); touch-action: none; }
  #hud {
    position: absolute; top: 10px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; font-weight: 700; font-size: 18px;
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: rgba(18,16,42,0.88); border-radius: 16px; text-align: center;
  }
  .hidden { display: none; }
  h1 { margin: 0; font-size: 34px; color: var(--accent); }
  h2 { margin: 0; font-size: 26px; }
  p { margin: 0; color: var(--muted); line-height: 1.4; }
  label { display: block; text-align: left; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #4b4690;
    background: var(--card); color: var(--fg); font-size: 18px;
  }
  .field { width: 100%; max-width: 340px; }
  button {
    background: var(--accent); color: #1b1640; border: 0; border-radius: 12px;
    padding: 12px 26px; font-size: 18px; font-weight: 800; cursor: pointer;
  }
  button.secondary { background: var(--card); color: var(--fg); border: 1px solid #4b4690; font-weight: 600; font-size: 15px; padding: 8px 16px; }
  button:hover { filter: brightness(1.1); }
  .big { font-size: 48px; font-weight: 900; color: var(--accent); }
  .hint { font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="hud" class="hidden"><span id="score">0</span><span id="lives"></span></div>

  <!-- Setup -->
  <div id="setup" class="screen">
    <h1>Werkstatt-Arcade</h1>
    <p>Mach das Spiel zu <em>deinem</em> Spiel.</p>
    <div class="field">
      <label for="name">Dein Name</label>
      <input id="name" maxlength="20" placeholder="z. B. Alex">
    </div>
    <div class="field">
      <label for="likes">Dinge, die du magst (Emojis, durch Leerzeichen getrennt)</label>
      <input id="likes" placeholder="🍕 ⚽ ☕ 🎮">
    </div>
    <div class="field">
      <label for="hates">Dinge, die du NICHT magst</label>
      <input id="hates" placeholder="📚 ⏰ 🥦 🧹">
    </div>
    <div class="field">
      <label for="avatar">Deine Spielfigur</label>
      <input id="avatar" maxlength="4" placeholder="😎">
    </div>
    <button id="saveBtn">Los geht's!</button>
  </div>

  <!-- Start -->
  <div id="start" class="screen hidden">
    <h2 id="greet">Hey!</h2>
    <p id="rules"></p>
    <p>Highscore: <strong id="hiStart">0</strong></p>
    <button id="playBtn">Spielen</button>
    <p class="hint">← → / A D, Maus oder Finger · Leertaste = Pause</p>
    <button id="editBtn" class="secondary">Vorlieben ändern</button>
  </div>

  <!-- Game Over -->
  <div id="over" class="screen hidden">
    <h2 id="overTitle">Game Over</h2>
    <div class="big" id="finalScore">0</div>
    <p id="overMsg"></p>
    <button id="againBtn">Nochmal</button>
    <button id="menuBtn" class="secondary">Menü</button>
  </div>
</div>

<script>
(() => {
  const W = 480, H = 720;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- Profil ----------
  // Werkstatt-Edition: 🪵 Holz, 🪚 Säge, 🖨️ 3D-Drucker, 🌳 Terraria, 🏎️ NFS Heat, ⚔️ Skyrim, ⛵ Anno 1800
  // Gegner: 🐛 Holzwurm, 💧 Feuchtigkeit, 🍝 Spaghetti-Fehldruck, 🧾 Papierkram
  const DEFAULTS = { name: 'Moritz', likes: '🪵 🪚 🖨️ 🌳 🏎️ ⚔️ ⛵', hates: '🐛 💧 🍝 🧾', avatar: '🧑‍🔧' };
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
  const splitEmojis = s => [...new Intl.Segmenter().segment(s)].map(x => x.segment).filter(x => x.trim());

  let profile = load('arcade.profile.v2', null);
  let hi = load('arcade.hi', 0);

  function showSetup() {
    const p = profile || DEFAULTS;
    $('name').value = p.name; $('likes').value = p.likes; $('hates').value = p.hates; $('avatar').value = p.avatar;
    show('setup');
  }
  function showStart() {
    const n = profile.name || 'du';
    $('greet').textContent = `Hey ${n}! ${profile.avatar}`;
    $('rules').innerHTML = `Fang <strong>${profile.likesArr.join(' ')}</strong><br>Weich aus: <strong>${profile.hatesArr.join(' ')}</strong><br>⭐ = Bonus · 💖 = Extra-Leben`;
    $('hiStart').textContent = hi;
    show('start');
  }
  function show(id) {
    ['setup', 'start', 'over'].forEach(s => $(s).classList.toggle('hidden', s !== id));
    $('hud').classList.toggle('hidden', id !== null);
  }

  $('saveBtn').onclick = () => {
    const likesArr = splitEmojis($('likes').value || DEFAULTS.likes);
    const hatesArr = splitEmojis($('hates').value || DEFAULTS.hates);
    profile = {
      name: $('name').value.trim(),
      likes: $('likes').value || DEFAULTS.likes,
      hates: $('hates').value || DEFAULTS.hates,
      avatar: splitEmojis($('avatar').value)[0] || DEFAULTS.avatar,
      likesArr, hatesArr,
    };
    save('arcade.profile.v2', profile);
    showStart();
  };
  $('editBtn').onclick = showSetup;
  $('playBtn').onclick = startGame;
  $('againBtn').onclick = startGame;
  $('menuBtn').onclick = showStart;

  // ---------- Spiel ----------
  let state = 'menu', player, items, particles, popups, score, lives, combo, t, spawnTimer, last, shake;
  const keys = {};
  let pointerX = null;

  function startGame() {
    player = { x: W / 2, y: H - 70, r: 28, vx: 0 };
    items = []; particles = []; popups = [];
    score = 0; lives = 3; combo = 0; t = 0; spawnTimer = 0; shake = 0;
    pointerX = null;
    state = 'play';
    show(null);
    $('hud').classList.remove('hidden');
    updateHud();
    last = performance.now();
  }

  function difficulty() { return 1 + t / 25; } // steigt mit der Zeit

  function spawn() {
    const d = difficulty();
    const r = Math.random();
    let kind, emoji;
    if (r < 0.03 && lives < 5) { kind = 'life'; emoji = '💖'; }
    else if (r < 0.08) { kind = 'star'; emoji = '⭐'; }
    else if (r < 0.08 + Math.min(0.55, 0.3 + t / 200)) { kind = 'bad'; emoji = pick(profile.hatesArr); }
    else { kind = 'good'; emoji = pick(profile.likesArr); }
    items.push({
      kind, emoji,
      x: 30 + Math.random() * (W - 60), y: -30,
      vy: (140 + Math.random() * 80) * Math.min(d, 3.2),
      vx: kind === 'bad' && t > 30 ? (Math.random() - 0.5) * 80 : 0,
      rot: 0, vr: (Math.random() - 0.5) * 3, r: 22,
    });
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }
  function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 0.9 }); }

  function update(dt) {
    t += dt;
    // Bewegung
    const speed = 460;
    let dir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    if (dir) { player.x += dir * speed * dt; pointerX = null; }
    else if (pointerX !== null) player.x += (pointerX - player.x) * Math.min(1, dt * 14);
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));

    // Spawnen
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = Math.max(0.22, 0.8 / difficulty()); }

    // Items
    for (const it of items) {
      it.y += it.vy * dt; it.x += it.vx * dt; it.rot += it.vr * dt;
      if (it.x < 20 || it.x > W - 20) it.vx *= -1;
      const dx = it.x - player.x, dy = it.y - player.y;
      if (!it.dead && dx * dx + dy * dy < (it.r + player.r) ** 2) {
        it.dead = true;
        if (it.kind === 'good') {
          combo++; const pts = 10 * Math.min(5, 1 + Math.floor(combo / 5));
          score += pts; burst(it.x, it.y, '#4ade80'); popup(it.x, it.y, '+' + pts, '#4ade80');
        } else if (it.kind === 'star') {
          score += 50; burst(it.x, it.y, '#ffcc33', 24); popup(it.x, it.y, '+50 ⭐', '#ffcc33');
        } else if (it.kind === 'life') {
          lives++; burst(it.x, it.y, '#f472b6', 20); popup(it.x, it.y, '+1 ❤️', '#f472b6');
        } else {
          lives--; combo = 0; shake = 0.3; burst(it.x, it.y, '#f87171', 20); popup(it.x, it.y, 'Autsch!', '#f87171');
          if (lives <= 0) return gameOver();
        }
        updateHud();
      }
      // verpasstes Lieblingsding bricht die Combo
      if (!it.dead && it.y > H + 30) { it.dead = true; if (it.kind === 'good') combo = 0; }
    }
    items = items.filter(it => !it.dead);

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt);
  }

  function updateHud() {
    $('score').textContent = `${score}${combo >= 5 ? '  x' + Math.min(5, 1 + Math.floor(combo / 5)) : ''}`;
    $('lives').textContent = '❤️'.repeat(Math.max(0, lives));
  }

  function gameOver() {
    state = 'over';
    const n = profile.name || 'du';
    const newHi = score > hi;
    if (newHi) { hi = score; save('arcade.hi', hi); }
    $('finalScore').textContent = score;
    $('overTitle').textContent = newHi ? '🏆 Neuer Highscore!' : 'Game Over';
    const msgs = score < 100 ? [`Erst mal Späne fegen, ${n}. Nochmal!`, `${profile.hatesArr[0]} hat diesmal gewonnen…`, `Das war noch der Rohzuschnitt.`]
      : score < 400 ? [`Passt wie Nut und Feder, ${n}!`, `Gesellenstück. ${profile.likesArr[0]} ist stolz auf dich.`, `Saubere Arbeit, kaum Spaghetti.`]
      : [`${n}, das ist ein Meisterstück!`, `Holztechniker-Niveau! ${profile.avatar}🔥`, `Kritischer Pfad: direkt zum Highscore.`];
    $('overMsg').textContent = pick(msgs) + `  (Highscore: ${hi})`;
    show('over');
  }

  // ---------- Zeichnen ----------
  const stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.3 }));

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake / 0.3, (Math.random() - 0.5) * 12 * shake / 0.3);

    // Sterne-Hintergrund
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (const s of stars) {
      s.y += s.s * (state === 'play' ? difficulty() : 0.4);
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    if (state === 'play' || state === 'pause' || state === 'over') {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '40px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      for (const it of items) {
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
        if (it.kind === 'star' || it.kind === 'life') { ctx.shadowColor = '#ffcc33'; ctx.shadowBlur = 20; }
        ctx.fillText(it.emoji, 0, 0); ctx.restore();
      }
      // Spieler
      ctx.font = '54px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      ctx.fillText(profile.avatar, player.x, player.y);
      if (profile.name) {
        ctx.font = 'bold 13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText(profile.name, player.x, player.y + 38);
      }
      for (const p of particles) { ctx.globalAlpha = p.life / 0.6; ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
      ctx.globalAlpha = 1;
      ctx.font = 'bold 22px system-ui';
      for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y); }
      ctx.globalAlpha = 1;
      if (state === 'pause') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 36px system-ui'; ctx.fillText('Pause', W / 2, H / 2);
      }
    }
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Eingabe ----------
  addEventListener('keydown', e => {
    keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
    if (e.key === ' ' && (state === 'play' || state === 'pause')) { state = state === 'play' ? 'pause' : 'play'; e.preventDefault(); }
  });
  addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
  function toCanvasX(clientX) { const r = cv.getBoundingClientRect(); return (clientX - r.left) / r.width * W; }
  cv.addEventListener('pointermove', e => { pointerX = toCanvasX(e.clientX); });
  cv.addEventListener('pointerdown', e => { pointerX = toCanvasX(e.clientX); });

  // ---------- Start ----------
  if (profile) showStart(); else showSetup();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
